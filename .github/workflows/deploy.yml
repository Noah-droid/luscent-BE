name: Deploy Backend to EC2

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
  REGISTRY: ghcr.io
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/noah-droid/qai-backend:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "=== Pulling latest image ==="
            docker pull ghcr.io/noah-droid/qai-backend:latest

            echo "=== Stopping old container ==="
            docker stop qai-api 2>/dev/null || true
            docker rm qai-api 2>/dev/null || true

            echo "=== Starting new container ==="
            docker run -d \
              --name qai-api \
              --restart unless-stopped \
              --network host \
              --env-file /home/ubuntu/qai/.env \
              ghcr.io/noah-droid/qai-backend:latest

            echo "=== Running migrations ==="
            docker exec qai-api python manage.py migrate --noinput

            echo "=== Cleanup ==="
            docker image prune -f

            echo "=== Deployment complete ==="
            docker ps | grep qai-api